[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cjvmt"
version = "0.1.0"
description = "Sentence-level Chinese–Japanese multimodal video translation"
requires-python = ">=3.11"
dependencies = ["typer>=0.15,<1", "PyYAML>=6,<7", "pydantic>=2,<3", "jinja2>=3,<4", "numpy>=1.24,<3"]

[project.optional-dependencies]
core = []
media = ["av>=13,<19"]
asr = ["faster-whisper>=1.1,<2"]
omni = ["torch>=2.7", "torchvision", "torchcodec; python_version < '3.14'", "transformers>=4.57,<5", "accelerate>=1", "qwen-omni-utils>=0.0.9,<0.1", "soundfile>=0.12"]
eval = ["sacrebleu>=2,<3", "matplotlib>=3.8,<4"]
demo = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1", "python-multipart>=0.0.18,<1", "gradio>=5,<7", "Pillow>=10,<15", "python-dotenv>=1,<2"]
realtime = ["faster-whisper>=1.1,<2", "av>=13,<19"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.27,<1", "fugashi>=1.4,<2", "unidic-lite>=1.0,<2"]

[project.scripts]
cjvmt = "cjvmt.cli:main"

[tool.setuptools.package-data]
cjvmt = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA GPU", "slow: extended test", "network: requires internet access"]
